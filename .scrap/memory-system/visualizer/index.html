<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Graph</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #18181b;
      --card-foreground: #fafafa;
      --border: #27272a;
      --muted: #3f3f46;
      --muted-foreground: #a1a1aa;
      --accent: #3f3f46;
      --accent-foreground: #fafafa;
      --primary: #fafafa;
      --radius: 0.5rem;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
      background: var(--background);
      color: var(--foreground);
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 1.5rem;
      gap: 1rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .stats {
      display: flex;
      gap: 0.75rem;
    }

    .stat {
      padding: 0.375rem 0.75rem;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted-foreground);
    }

    #graph-container {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    #network {
      width: 100%;
      height: 100%;
      background: var(--card);
    }

    .controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--foreground);
      cursor: pointer;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:hover {
      background: var(--accent);
      border-color: var(--muted);
    }

    button:active {
      transform: scale(0.98);
    }

    .node-info {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      display: none;
      z-index: 10;
    }

    .node-info.active {
      display: block;
    }

    .node-info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }

    .node-type {
      display: inline-flex;
      padding: 0.25rem 0.5rem;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-foreground);
    }

    .node-id {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      font-family: 'Courier New', monospace;
    }

    .node-content {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--foreground);
      margin-bottom: 0.75rem;
    }

    .node-meta {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      font-size: 0.75rem;
      color: var(--muted-foreground);
      line-height: 1.6;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    .tag {
      padding: 0.125rem 0.5rem;
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.75rem;
      color: var(--muted-foreground);
    }

    /* Vis.js overrides for dark theme */
    .vis-network {
      outline: none;
    }

    .vis-tooltip {
      background: var(--card) !important;
      border: 1px solid var(--border) !important;
      color: var(--foreground) !important;
      border-radius: var(--radius) !important;
      padding: 0.5rem !important;
      font-size: 0.875rem !important;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>🧠 Knowledge Graph</h1>
        <div class="stats">
          <div class="stat">
            <span id="node-count">0 nodes</span>
          </div>
          <div class="stat">
            <span id="edge-count">0 edges</span>
          </div>
        </div>
      </div>
    </div>

    <div id="graph-container">
      <div class="controls">
        <button onclick="refreshGraph()">↻ Refresh</button>
        <button onclick="fitGraph()">⊙ Fit</button>
      </div>
      <div id="network"></div>
      <div class="node-info" id="node-info">
        <div class="node-info-header">
          <span class="node-type" id="info-type"></span>
          <span class="node-id" id="info-id"></span>
        </div>
        <div class="node-content" id="info-content"></div>
        <div class="node-meta" id="info-meta"></div>
      </div>
    </div>
  </div>

  <script>
    let network;
    let nodes;
    let edges;

    // Minimal color scheme for dark theme
    const typeColors = {
      note: { bg: '#3b82f6', border: '#60a5fa' },      // Blue
      person: { bg: '#a855f7', border: '#c084fc' },    // Purple
      task: { bg: '#06b6d4', border: '#22d3ee' },      // Cyan
      concept: { bg: '#10b981', border: '#34d399' },   // Green
      event: { bg: '#f59e0b', border: '#fbbf24' }      // Amber
    };

    async function loadGraph() {
      try {
        const response = await fetch('/api/graph');
        const data = await response.json();

        // Transform nodes for vis.js
        const visNodes = data.nodes.map(node => {
          const colors = typeColors[node.type] || { bg: '#71717a', border: '#a1a1aa' };
          return {
            id: node.id,
            label: node.content.length > 30
              ? node.content.substring(0, 30) + '...'
              : node.content,
            title: node.content,
            color: {
              background: colors.bg,
              border: colors.border,
              highlight: {
                background: colors.border,
                border: colors.bg
              }
            },
            font: {
              color: '#fafafa',
              size: 12,
              face: 'Inter, sans-serif',
              strokeWidth: 0
            },
            shape: 'dot',
            size: 16,
            data: node
          };
        });

        // Transform edges for vis.js
        const visEdges = data.edges.map(edge => ({
          from: edge.from,
          to: edge.to,
          label: edge.label,
          arrows: { to: { enabled: true, scaleFactor: 0.5 } },
          color: {
            color: '#3f3f46',
            highlight: '#71717a',
            opacity: 0.8
          },
          font: {
            size: 11,
            color: '#a1a1aa',
            strokeWidth: 0,
            background: '#18181b'
          },
          smooth: { type: 'curvedCW', roundness: 0.15 },
          width: 1.5
        }));

        // Update stats
        document.getElementById('node-count').textContent = `${visNodes.length} nodes`;
        document.getElementById('edge-count').textContent = `${visEdges.length} edges`;

        // Create network
        const container = document.getElementById('network');
        nodes = new vis.DataSet(visNodes);
        edges = new vis.DataSet(visEdges);

        const networkData = { nodes, edges };
        const options = {
          physics: {
            enabled: true,
            stabilization: { iterations: 150 },
            barnesHut: {
              gravitationalConstant: -3000,
              centralGravity: 0.4,
              springLength: 120,
              springConstant: 0.05,
              damping: 0.3
            }
          },
          interaction: {
            hover: true,
            tooltipDelay: 100,
            hideEdgesOnDrag: true
          }
        };

        if (network) {
          network.setData(networkData);
        } else {
          network = new vis.Network(container, networkData, options);

          // Click event to show node details
          network.on('click', function (params) {
            if (params.nodes.length > 0) {
              const nodeId = params.nodes[0];
              const node = nodes.get(nodeId);
              showNodeInfo(node.data);
            } else {
              hideNodeInfo();
            }
          });
        }

      } catch (error) {
        console.error('Failed to load graph:', error);
      }
    }

    function showNodeInfo(node) {
      const infoBox = document.getElementById('node-info');
      document.getElementById('info-type').textContent = node.type;
      document.getElementById('info-id').textContent = `#${node.id.substring(0, 12)}...`;
      document.getElementById('info-content').textContent = node.content;

      let metaHtml = `
                Created: ${new Date(node.meta.created_at).toLocaleDateString()} ${new Date(node.meta.created_at).toLocaleTimeString()}<br>
                Updated: ${new Date(node.meta.updated_at).toLocaleDateString()} ${new Date(node.meta.updated_at).toLocaleTimeString()}
            `;

      if (node.meta.tags && node.meta.tags.length > 0) {
        metaHtml += '<div class="tags">';
        node.meta.tags.forEach(tag => {
          metaHtml += `<span class="tag">${tag}</span>`;
        });
        metaHtml += '</div>';
      }

      document.getElementById('info-meta').innerHTML = metaHtml;
      infoBox.classList.add('active');
    }

    function hideNodeInfo() {
      document.getElementById('node-info').classList.remove('active');
    }

    function refreshGraph() {
      loadGraph();
    }

    function fitGraph() {
      if (network) {
        network.fit({ animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
      }
    }

    // Load graph on startup
    loadGraph();

    // Auto-refresh every 5 seconds
    setInterval(refreshGraph, 5000);
  </script>
</body>

</html>
