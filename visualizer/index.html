<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual-Memory Visualizer</title>
  <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
      --primary: 210 40% 98%;
      --primary-foreground: 222.2 47.4% 11.2%;
      --secondary: 217.2 32.6% 17.5%;
      --secondary-foreground: 210 40% 98%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
      --ring: 212.7 26.8% 83.9%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      height: 100vh;
      overflow: hidden;
    }

    .container {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0;
    }

    .header {
      background: hsl(var(--card));
      border-bottom: 1px solid hsl(var(--border));
      padding: 1rem 2rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .stats {
      display: flex;
      gap: 2rem;
      font-size: 0.875rem;
      color: hsl(var(--muted-foreground));
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-value {
      font-weight: 600;
      color: hsl(var(--foreground));
    }

    .main-content {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100%;
      background: hsl(var(--background));
    }

    .sidebar {
      background: hsl(var(--card));
      border-right: 1px solid hsl(var(--border));
      overflow-y: auto;
      padding: 1.5rem;
    }

    .sidebar h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: hsl(var(--foreground));
    }

    .stm-list {
      list-style: none;
    }

    .stm-item {
      background: hsl(var(--secondary));
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
      border-left: 3px solid hsl(210 90% 60%);
    }

    .stm-item-time {
      font-size: 0.75rem;
      color: hsl(var(--muted-foreground));
      margin-top: 0.25rem;
    }

    .graph-container {
      height: 100%;
      position: relative;
    }

    #network {
      height: 100%;
      width: 100%;
    }

    .node-info {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 8px;
      padding: 1.5rem;
      min-width: 300px;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
      display: none;
    }

    .node-info.visible {
      display: block;
    }

    .node-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: hsl(var(--foreground));
    }

    .node-detail {
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
    }

    .node-detail-label {
      color: hsl(var(--muted-foreground));
    }

    .node-detail-value {
      color: hsl(var(--foreground));
      margin-left: 0.5rem;
    }

    .node-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .tag {
      background: hsl(var(--secondary));
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      color: hsl(var(--muted-foreground));
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: hsl(var(--muted-foreground));
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Dual-Memory Visualizer</h1>
      <div class="stats">
        <div class="stat">
          <span>STM:</span>
          <span class="stat-value" id="stm-count">0</span>
        </div>
        <div class="stat">
          <span>LTM Nodes:</span>
          <span class="stat-value" id="ltm-nodes-count">0</span>
        </div>
        <div class="stat">
          <span>LTM Edges:</span>
          <span class="stat-value" id="ltm-edges-count">0</span>
        </div>
        <div class="stat">
          <span>Auto-refresh:</span>
          <span class="stat-value">5s</span>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="sidebar">
        <h2>Short-Term Memory</h2>
        <ul class="stm-list" id="stm-list">
          <li class="empty-state">No STM entries</li>
        </ul>
      </div>

      <div class="graph-container">
        <div id="network"></div>
        <div class="node-info" id="node-info">
          <h3 id="node-info-title">Select a node</h3>
          <div class="node-details" id="node-details"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let network;
    let selectedNode = null;

    // Initialize network
    function initNetwork() {
      const container = document.getElementById('network');
      const data = {
        nodes: new vis.DataSet([]),
        edges: new vis.DataSet([])
      };

      const options = {
        nodes: {
          shape: 'dot',
          size: 16,
          font: { size: 12, color: 'hsl(210, 40%, 98%)' },
          borderWidth: 2,
          borderWidthSelected: 3,
        },
        edges: {
          width: 2,
          color: { color: 'hsl(217.2, 32.6%, 30%)', highlight: 'hsl(210, 90%, 60%)' },
          arrows: { to: { enabled: true, scaleFactor: 0.5 } },
          smooth: { type: 'continuous' },
          font: { size: 10, color: 'hsl(215, 20.2%, 65.1%)', align: 'top' }
        },
        physics: {
          stabilization: { iterations: 100 },
          barnesHut: { gravitationalConstant: -8000, springLength: 150 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200
        }
      };

      network = new vis.Network(container, data, options);

      network.on('click', (params) => {
        if (params.nodes.length > 0) {
          selectedNode = params.nodes[0];
          showNodeInfo(selectedNode);
        } else {
          hideNodeInfo();
        }
      });
    }

    // Color map for node types
    const nodeColors = {
      person: { background: 'hsl(210, 90%, 50%)', border: 'hsl(210, 90%, 40%)' },
      preference: { background: 'hsl(280, 70%, 50%)', border: 'hsl(280, 70%, 40%)' },
      skill: { background: 'hsl(150, 70%, 45%)', border: 'hsl(150, 70%, 35%)' },
      project: { background: 'hsl(30, 90%, 55%)', border: 'hsl(30, 90%, 45%)' },
      concept: { background: 'hsl(50, 90%, 55%)', border: 'hsl(50, 90%, 45%)' },
      fact: { background: 'hsl(200, 60%, 50%)', border: 'hsl(200, 60%, 40%)' },
      event: { background: 'hsl(340, 75%, 50%)', border: 'hsl(340, 75%, 40%)' },
    };

    // Fetch and update data
    async function updateData() {
      try {
        // Fetch all data
        const [stmRes, nodesRes, edgesRes] = await Promise.all([
          fetch('/api/stm'),
          fetch('/api/ltm/nodes'),
          fetch('/api/ltm/edges')
        ]);

        const stm = await stmRes.json();
        const nodesData = await nodesRes.json();
        const edgesData = await edgesRes.json();

        // Update STM display
        updateSTM(stm);

        // Update LTM graph
        updateGraph(nodesData, edgesData);

        // Update stats
        document.getElementById('stm-count').textContent = stm.length;
        document.getElementById('ltm-nodes-count').textContent = Object.keys(nodesData).length;
        document.getElementById('ltm-edges-count').textContent = Object.keys(edgesData).length;

      } catch (err) {
        console.error('Error fetching data:', err);
      }
    }

    // Update STM list
    function updateSTM(stm) {
      const list = document.getElementById('stm-list');

      if (stm.length === 0) {
        list.innerHTML = '<li class="empty-state">No STM entries</li>';
        return;
      }

      list.innerHTML = stm.map(entry => `
        <li class="stm-item">
          <div>${entry.content}</div>
          <div class="stm-item-time">${new Date(entry.timestamp).toLocaleString()}</div>
        </li>
      `).join('');
    }

    // Update graph
    function updateGraph(nodesData, edgesData) {
      const nodes = Object.values(nodesData).map(node => {
        const color = nodeColors[node.type] || nodeColors.fact;
        const label = node.content.length > 40
          ? node.content.substring(0, 40) + '...'
          : node.content;

        return {
          id: node.id,
          label,
          title: node.content,
          color,
          nodeData: node
        };
      });

      const edges = Object.values(edgesData).map(edge => ({
        id: edge.id,
        from: edge.from,
        to: edge.to,
        label: edge.label,
        title: edge.label
      }));

      network.setData({ nodes, edges });
    }

    // Show node info
    function showNodeInfo(nodeId) {
      const nodeData = network.body.data.nodes.get(nodeId);
      if (!nodeData || !nodeData.nodeData) return;

      const node = nodeData.nodeData;
      const infoPanel = document.getElementById('node-info');
      const title = document.getElementById('node-info-title');
      const details = document.getElementById('node-details');

      title.textContent = node.content;

      let html = `
        <div class="node-detail">
          <span class="node-detail-label">Type:</span>
          <span class="node-detail-value">${node.type}</span>
        </div>
        <div class="node-detail">
          <span class="node-detail-label">Created:</span>
          <span class="node-detail-value">${new Date(node.meta.created_at).toLocaleDateString()}</span>
        </div>
      `;

      if (node.meta.tags && node.meta.tags.length > 0) {
        html += `
          <div class="node-tags">
            ${node.meta.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
        `;
      }

      details.innerHTML = html;
      infoPanel.classList.add('visible');
    }

    // Hide node info
    function hideNodeInfo() {
      document.getElementById('node-info').classList.remove('visible');
      selectedNode = null;
    }

    // Initialize
    initNetwork();
    updateData();
    setInterval(updateData, 5000); // Refresh every 5 seconds
  </script>
</body>

</html>
